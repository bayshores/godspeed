# electron-builder config — godspeed desktop (macOS arm64; Windows/Linux x64).
#
# Lives in electron/, so every build passes it explicitly:
#   electron-builder -c electron/electron-builder.yml ...
# Paths below are relative to the PROJECT dir (the repo root, where
# electron-builder runs), not to this file's folder.
#
# Shape:
#   - the app's real server (.next/standalone, curated by
#     scripts/build-server.mjs) ships via extraResources — OUTSIDE the asar,
#     because native .node/dylib can't dlopen from a read-only archive and
#     server.js process.chdir()s into its own dir;
#   - the asar holds only the shell (electron/main.cjs + package.json);
#   - signed + notarized (Developer ID Application cert in the login
#     keychain; notary credentials in the LH_NOTARY keychain profile; the
#     profile + team env vars are baked into desktop:dist).
appId: com.bayshores.godspeed
productName: godspeed
directories:
  output: dist
  buildResources: electron/build
# Icons — per-platform sources in electron/build/:
#   mac   electron/build/icon.icon  — the Icon Composer document (layered Liquid
#         Glass); actool (Xcode 26+) compiles Assets.car (CFBundleIconName,
#         macOS 26+ renders the true layered icon) + an actool fallback icns
#         capped at 256px, which scripts/after-pack.cjs swaps for the
#         hand-packed full-res electron/build/icon.icns (pre-Tahoe keeps 16→1024).
#         Requires actool ≥ 26: desktop:dist injects DEVELOPER_DIR locally;
#         the release workflow's mac job runs setup-xcode.
#   win   electron/build/icon.ico  — generated (16→256) from the flat design by
#         scripts/make-icons.mjs.
#   linux electron/build/icon.png  — 512×512, same script. Rounded squircle with
#         baked transparency on both — Windows/Linux don't
#         mask, the shape ships in the artwork.
files:
  # Only the shell goes into the asar. ORDER IS LOAD-BEARING:
  # electron-builder's dependency collector packs the whole production dep
  # tree into node_modules/ REGARDLESS of this allow-list unless a negation
  # comes first (without one, the asar held every server dependency while
  # the launcher needs only electron + node builtins).
  #
  # Gitignore-style ordering: '!**/*' first excludes EVERYTHING, the
  # positives after it re-include only the shell. app-builder-lib's filter
  # checks each dep file's DESTINATION path, so '!**/*' matches every
  # 'node_modules/<dep>/...' path and the bare positives never re-include one.
  - "!**/*"
  - electron/**/*
  # electron/ also holds the packaging inputs (icons, entitlements, dmg
  # art, this config) — build-time only, kept out of the asar.
  - "!electron/build{,/**/*}"
  - "!electron/electron-builder.yml"
  - package.json
  # Auto-update: electron-updater + its runtime tree re-included explicitly.
  # The negation above excludes node_modules, and the shell's bare positives
  # can't re-include them — these explicit node_modules positives do
  # (gitignore order: the LAST matching pattern wins).
  # The tree, from each package's declared dependencies:
  # electron-updater → fs-extra, js-yaml, lazy-val, lodash.escaperegexp,
  # lodash.isequal, semver, tiny-typed-emitter, builder-util-runtime;
  # builder-util-runtime → debug, sax; fs-extra → graceful-fs, jsonfile,
  # universalify; debug → ms; jsonfile → universalify (again); js-yaml →
  # argparse. Keep in sync when electron-updater bumps (npm ls --all).
  - node_modules/electron-updater/**/*
  - node_modules/fs-extra/**/*
  - node_modules/js-yaml/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/semver/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/debug/**/*
  - node_modules/sax/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/ms/**/*
  - node_modules/argparse/**/*
  # Installed-font listing for Appearance → Reading font (no dependencies).
  - node_modules/font-list/**/*
# font-list runs a small helper program (macOS) or script (Windows), which
# can't execute from inside the asar.
asarUnpack:
  - node_modules/font-list/libs/**/*
extraResources:
  # Attribution/license for the bounded local Pi cutoff-selector port.
  - from: docs/compaction-accounting.md
    to: licenses/pi-compaction.md
  # Copy from the PARENT dir (.next), not .next/standalone itself:
  # electron-builder hard-excludes a copy's root node_modules and the
  # default no-filter pattern is a literal path match (empirically both
  # node_modules/ and .next/ were silently dropped → server died on
  # "Cannot find module 'next'"). With `from: .next` the filter's
  # relative paths start with standalone/, dodging the root-node_modules
  # rule, and the explicit wildcard (minimatch dot:true) reaches
  # standalone/.next and standalone/node_modules.
  - from: .next
    to: server
    filter:
      - "standalone/**/*"
  # The backend's --require runs before Next loads, so it stays outside
  # app.asar like the macOS title guard below.
  - from: electron/server-parent-guard.cjs
    to: server-parent-guard.cjs
mac:
  # The backend's --require runs before Next loads. Keep this resource
  # outside app.asar so early Node-mode loading needs no ASAR support.
  extraResources:
    - from: electron/server-title-guard.cjs
      to: server-title-guard.cjs
  icon: electron/build/icon.icon
  # zip rides next to dmg: Squirrel.Mac — Electron's
  # macOS auto-updater — installs from ZIP and cannot read DMGs. DMG is
  # for humans; ZIP + blockmap are the updater's payload.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # English-only app: cuts every non-en .lproj from the frameworks.
  electronLanguages:
    - en
  category: public.app-category.education
  hardenedRuntime: true
  entitlements: electron/build/entitlements.mac.plist
  # Signing + notarization: identity auto-detects the
  # Developer ID Application certificate from the login keychain;
  # notarize: true makes electron-builder sign → submit to Apple's notary
  # service → staple the ticket, all inside this one build (credentials
  # via the LH_NOTARY keychain profile, env baked into desktop:dist).
  # Adds minutes per build (Apple's scan queue). Verification battery:
  # codesign --verify --deep / spctl --assess / stapler validate.
  notarize: true
dmg:
  # Download names: the files people download
  # carry no version, so the README can link to
  # releases/latest/download/<name> and it always gets the newest one.
  # The updater's own files (the mac zip, blockmaps, latest*.yml) keep
  # their default names.
  artifactName: "${productName}-mac-apple-silicon.${ext}"
  title: "${productName} ${version}"
  # Artwork: 540×380 at 1×; the sibling background@2x.png is
  # combined into a Retina TIFF by dmg-builder. Centres use 1× coordinates.
  background: electron/build/background.png
  iconSize: 80
  contents:
    - x: 130
      y: 190
      type: file
    - x: 410
      y: 190
      type: link
      path: /Applications
afterPack: scripts/after-pack.cjs
electronFuses:
  # The browser-service helper opens model-written demos from file://; without
  # this they could fetch any other file on disk.
  grantFileProtocolExtraPrivileges: false
  # No --inspect flags or SIGUSR1: nothing can attach a debugger to the app.
  enableNodeCliInspectArguments: false
  # Flipping a fuse edits the binary; the ad-hoc re-sign keeps unsigned arm64
  # builds (desktop:local) launchable. Signed builds are re-signed after.
  resetAdHocDarwinSignature: true
win:
  icon: electron/build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-windows-x64-setup.${ext}"
  # Unsigned Windows release: preserve icon/version metadata,
  # skip signing, and do not require a publisher signature for updates.
  signExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: true
  perMachine: false
linux:
  icon: electron/build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  # "x64" is spelled out: ${arch} would say x86_64 or amd64 here.
  artifactName: "${productName}-linux-x64.${ext}"
  category: Education
  # Match Electron's app_id/WM_CLASS to the installed desktop launcher.
  syncDesktopName: true
  # Both targets update via electron-updater 6.8.9. AppImage replaces its
  # own file; deb uses dpkg/apt and may request administrator permission.
publish:
  # Update feed = GitHub Releases: latest-mac.yml + zip/blockmap live on
  # releases; electron-updater reads them anonymously. REQUIRES THE REPO TO
  # BE PUBLIC — anonymous downloads from a private repo are impossible, and
  # a token baked into the app would be a leak. desktop:dist passes no
  # --publish flag, so builds never upload; publishing happens at release
  # time (GH_TOKEN + --publish).
  - provider: github
    owner: bayshores
    repo: godspeed
    # All three CI jobs contribute assets; only the owner publishes it.
    releaseType: draft
