<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher preview</title>
<style>
  :root { --bg:#000; --panel:#080808; --tone:#161616; --tone2:#2F2F2F; --text:#E6E6E6; --muted:#8D8D8D; --body:#EDEDED; --ink:#000; --blush:#FF8FA3; --sweat:#7CC7FF; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:15px/1.5 "Source Sans 3", system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px 16px; }
  h1 { margin:0; font-size:20px; font-weight:800; }
  p { margin:0; color:var(--muted); text-align:center; max-width:560px; }
  .stage { width:320px; height:320px; background:var(--panel); display:grid; place-items:center; }
  svg { width:240px; height:240px; overflow:visible; cursor:pointer; }
  .row { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:720px; }
  button { background:var(--tone); color:var(--text); border:0; padding:8px 12px; font:inherit; font-size:14px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--text); color:#000; font-weight:700; }
  #cap { min-height:24px; }

  /* motion */
  .bot { transform-origin:120px 210px; animation:bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
  .shadow { transform-origin:120px 226px; animation:shadow 3.2s ease-in-out infinite; }
  @keyframes shadow { 0%,100% { transform:scaleX(1); opacity:.12 } 50% { transform:scaleX(.88); opacity:.07 } }
  .look { transition:transform .18s ease-out; }
  .eyes-normal { transform-origin:120px 108px; animation:blink 4.6s infinite; }
  @keyframes blink { 0%,94%,100% { transform:scaleY(1) } 96% { transform:scaleY(.08) } }
  .face > g { display:none; }
  [data-mood="idle"] .m-idle, [data-mood="talking"] .m-idle,
  [data-mood="happy"] .m-happy, [data-mood="sparkle"] .m-sparkle,
  [data-mood="thinking"] .m-thinking, [data-mood="oops"] .m-oops,
  [data-mood="shocked"] .m-shocked, [data-mood="dizzy"] .m-dizzy,
  [data-mood="embarrassed"] .m-embarrassed, [data-mood="sleepy"] .m-sleepy { display:inline; }
  .mouth { display:none; transform-box:fill-box; transform-origin:center; }
  [data-mood="talking"] .mouth { display:inline; animation:mouth .17s ease-in-out infinite alternate; }
  @keyframes mouth { from { transform:scaleY(.25) } to { transform:scaleY(1) } }
  [data-mood="talking"] .bot { animation:talk .34s ease-in-out infinite alternate; }
  @keyframes talk { from { transform:scale(1.03,.97) } to { transform:scale(.98,1.03) } }
  [data-mood="happy"] .bot, [data-mood="sparkle"] .bot { animation:hop .7s cubic-bezier(.3,1.6,.5,1) infinite; }
  @keyframes hop { 0%,100% { transform:translateY(0) scale(1,1) } 30% { transform:translateY(-22px) scale(.96,1.05) } 60% { transform:translateY(0) scale(1.06,.94) } }
  [data-mood="sleepy"] .bot { animation:breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform:translateY(6px) scale(1.02,.97) } 50% { transform:translateY(8px) scale(1.04,.95) } }
  [data-mood="shocked"] .bot { animation:jolt .5s ease-out 1; }
  @keyframes jolt { 0% { transform:scale(1) } 30% { transform:scale(.92,1.1) translateY(-10px) } 100% { transform:scale(1) } }
  [data-mood="dizzy"] .bot { animation:wobble 1s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform:rotate(-5deg) } 50% { transform:rotate(5deg) } }
  .spin { transform-box:fill-box; transform-origin:center; animation:spin 1.2s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg) } }
  .pulse { animation:pulse 1.2s ease-in-out infinite; }
  .pulse:nth-child(2) { animation-delay:.2s } .pulse:nth-child(3) { animation-delay:.4s }
  @keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  .drip { animation:drip 1.6s ease-in infinite; }
  @keyframes drip { 0% { transform:translateY(0); opacity:1 } 80% { transform:translateY(10px); opacity:1 } 100% { transform:translateY(12px); opacity:0 } }
  .twinkle { transform-box:fill-box; transform-origin:center; animation:twinkle .9s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { transform:scale(1) } 50% { transform:scale(.7) } }
  .zz { animation:zz 2.4s ease-in-out infinite; }
  .zz:nth-of-type(2) { animation-delay:.8s }
  @keyframes zz { 0% { transform:translate(0,0); opacity:0 } 30% { opacity:1 } 100% { transform:translate(14px,-26px); opacity:0 } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <h1>The teacher</h1>
  <p>Move your mouse: its eyes follow you. Click it to make it hop. Pick a mood below to see each expression and its motion.</p>
  <div class="stage">
    <svg id="svg" viewBox="0 0 240 240" data-mood="idle" aria-label="godspeed teacher">
      <ellipse class="shadow" cx="120" cy="226" rx="58" ry="6" fill="#fff" opacity=".12"/>
      <g class="bot">
        <circle cx="120" cy="120" r="90" fill="var(--body)"/>
        <g class="look" id="look">
          <ellipse class="mouth" cx="120" cy="150" rx="9" ry="7" fill="var(--ink)"/>
          <g class="face">
            <!-- idle / talking: big glossy anime eyes -->
            <g class="m-idle"><g class="eyes-normal">
              <rect x="82" y="86" width="26" height="44" rx="13" fill="var(--ink)"/><rect x="132" y="86" width="26" height="44" rx="13" fill="var(--ink)"/>
            </g></g>
            <!-- happy ^_^ with blush -->
            <g class="m-happy">
              <path d="M80 112 Q95 90 110 112" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
              <path d="M130 112 Q145 90 160 112" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
              <ellipse cx="76" cy="134" rx="13" ry="7" fill="var(--blush)" opacity=".75"/><ellipse cx="164" cy="134" rx="13" ry="7" fill="var(--blush)" opacity=".75"/>
              <path d="M108 140 Q120 152 132 140" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            </g>
            <!-- sparkle: star eyes -->
            <g class="m-sparkle">
              <path class="twinkle" d="M95 84 L101 101 L118 107 L101 113 L95 130 L89 113 L72 107 L89 101 Z" fill="var(--ink)"/>
              <path class="twinkle" d="M145 84 L151 101 L168 107 L151 113 L145 130 L139 113 L122 107 L139 101 Z" fill="var(--ink)"/>
              <ellipse cx="74" cy="136" rx="12" ry="6" fill="var(--blush)" opacity=".7"/><ellipse cx="166" cy="136" rx="12" ry="6" fill="var(--blush)" opacity=".7"/>
              <path d="M110 142 Q120 150 130 142" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            </g>
            <!-- thinking: eyes up-right, pulsing dots -->
            <g class="m-thinking">
              <rect x="92" y="78" width="24" height="38" rx="12" fill="var(--ink)"/><rect x="140" y="78" width="24" height="38" rx="12" fill="var(--ink)"/>
              
              <path d="M112 146 L128 142" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
              <g><circle class="pulse" cx="188" cy="44" r="6" fill="var(--body)"/><circle class="pulse" cx="206" cy="30" r="5" fill="var(--body)"/><circle class="pulse" cx="222" cy="16" r="4" fill="var(--body)"/></g>
            </g>
            <!-- oops: sweat drop, wobbly mouth -->
            <g class="m-oops">
              <rect x="84" y="92" width="24" height="36" rx="12" fill="var(--ink)"/><rect x="132" y="92" width="24" height="36" rx="12" fill="var(--ink)"/>
              
              <path d="M104 148 Q110 142 116 148 Q122 154 128 148 Q134 142 138 148" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>
              <path class="drip" d="M178 58 Q190 76 184 84 Q176 90 170 82 Q166 74 178 58 Z" fill="var(--sweat)"/>
            </g>
            <!-- shocked O_O -->
            <g class="m-shocked">
              <circle cx="95" cy="106" r="19" fill="none" stroke="var(--ink)" stroke-width="6"/><circle cx="145" cy="106" r="19" fill="none" stroke="var(--ink)" stroke-width="6"/>
              <circle cx="95" cy="106" r="5" fill="var(--ink)"/><circle cx="145" cy="106" r="5" fill="var(--ink)"/>
              <ellipse cx="120" cy="150" rx="9" ry="11" fill="var(--ink)"/>
            </g>
            <!-- dizzy @_@ -->
            <g class="m-dizzy">
              <path class="spin" d="M95 106 m-16 0 a16 16 0 1 0 32 0 a11 11 0 1 0 -22 0 a6 6 0 1 0 12 0" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>
              <path class="spin" d="M145 106 m-16 0 a16 16 0 1 0 32 0 a11 11 0 1 0 -22 0 a6 6 0 1 0 12 0" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M108 148 Q114 142 120 148 Q126 154 132 148" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>
            </g>
            <!-- embarrassed >_< -->
            <g class="m-embarrassed">
              <path d="M82 94 L106 106 L82 118" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M158 94 L134 106 L158 118" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
              <ellipse cx="76" cy="134" rx="14" ry="7" fill="var(--blush)" opacity=".85"/><ellipse cx="164" cy="134" rx="14" ry="7" fill="var(--blush)" opacity=".85"/>
              <path d="M110 146 L130 146" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            </g>
            <!-- sleepy -_- zzz -->
            <g class="m-sleepy">
              <path d="M80 112 L110 112" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/><path d="M130 112 L160 112" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
              <ellipse cx="120" cy="146" rx="6" ry="4" fill="var(--ink)"/>
              <text class="zz" x="180" y="60" fill="var(--body)" font-size="22" font-weight="800" font-family="system-ui">z</text>
              <text class="zz" x="196" y="44" fill="var(--body)" font-size="16" font-weight="800" font-family="system-ui">z</text>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </div>
  <div id="cap"></div>
  <div class="row" id="moods"></div>
<script>
  const moods = [
    ["idle", "Idle", "Resting. Bobs, blinks, eyes follow your mouse."],
    ["talking", "Talking", "While a teacher message is being written."],
    ["thinking", "Thinking", "The agent is working: reading, building the graph, planning."],
    ["happy", "Happy ^_^", "You got one right."],
    ["sparkle", "Sparkle", "A streak, or you finished something due."],
    ["oops", "Oops", "You got one wrong. Gentle, not sad."],
    ["shocked", "O_O", "A deadline is under an hour away."],
    ["dizzy", "@_@", "Something went wrong (a job failed)."],
    ["embarrassed", ">_<", "The agent made a mistake and is fixing it."],
    ["sleepy", "Sleepy", "No agent connected. Waiting for /godspeed:teach."]
  ];
  const svg = document.getElementById("svg"), look = document.getElementById("look"), cap = document.getElementById("cap"), row = document.getElementById("moods");
  function setMood(m) {
    svg.dataset.mood = m;
    for (const b of row.children) b.setAttribute("aria-pressed", b.dataset.m === m);
    cap.textContent = moods.find(x => x[0] === m)[2];
  }
  for (const [m, label] of moods) {
    const b = document.createElement("button"); b.textContent = label; b.dataset.m = m;
    b.onclick = () => setMood(m); row.appendChild(b);
  }
  setMood("idle");
  window.addEventListener("pointermove", e => {
    if (svg.dataset.mood === "sleepy" || svg.dataset.mood === "dizzy") { look.style.transform = ""; return; }
    const r = svg.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / 400)), dy = Math.max(-1, Math.min(1, (e.clientY - cy) / 400));
    look.style.transform = `translate(${dx * 12}px, ${dy * 9}px)`;
  });
  let back;
  svg.addEventListener("click", () => {
    const prev = svg.dataset.mood === "happy" ? "idle" : svg.dataset.mood;
    setMood("happy"); clearTimeout(back); back = setTimeout(() => setMood(prev), 1400);
  });
</script>
</body>
</html>
