[package]
name = "gs-search"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gs-json.workspace = true
gs-base.workspace = true
gs-core.workspace = true
ort.workspace = true
parking_lot.workspace = true
tokenizers.workspace = true
tokio.workspace = true

# Linux loads ONNX Runtime from the resources folder at run time: the static build ort links in
# elsewhere needs a newer glibc than the Linux app supports.
[target.'cfg(target_os = "linux")'.dependencies]
ort = { workspace = true, features = ["load-dynamic"] }

[lints]
workspace = true
