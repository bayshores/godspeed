[package]
name = "gs-shell"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "godspeed"
path = "src/main.rs"

[features]
# The developer tools in a release build (debug builds always have them).
devtools = ["tauri/devtools"]

[dependencies]
gs-base.workspace = true
gs-shell-rpc.workspace = true
getrandom.workspace = true
os_info.workspace = true
rfd.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
fontdb.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSBitmapImageRep", "NSFontManager", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSDictionary", "NSError", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString", "NSTimer", "NSURL", "NSURLRequest", "NSURLResponse", "NSUserDefaults", "NSValue", "block2"] }
objc2-pdf-kit = { workspace = true, features = ["PDFDocument", "PDFPage", "objc2-app-kit"] }
objc2-web-kit = { workspace = true, features = ["WKContentRuleList", "WKContentRuleListStore", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKPreferences", "WKSnapshotConfiguration", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2", "objc2-app-kit"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
image.workspace = true
objc2-app-kit = { workspace = true, features = ["NSMenu", "NSMenuItem", "NSPDFInfo", "NSPanel"] }
objc2-foundation = { workspace = true, features = ["NSDate"] }

[build-dependencies]
tauri-build.workspace = true

# WebKit and AppKit need the process's main thread, which only a test without the harness has.
[[test]]
name = "mac_demo"
harness = false

[[test]]
name = "mac_print"
harness = false

[lints]
workspace = true
