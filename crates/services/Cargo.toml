[package]
name = "gs-services"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gs-json.workspace = true
gs-base.workspace = true
gs-core.workspace = true
gs-store.workspace = true
gs-engine.workspace = true
gs-agent.workspace = true
gs-runtime.workspace = true
gs-files.workspace = true
gs-pdf.workspace = true
gs-search.workspace = true
gs-media.workspace = true
gs-transcribe.workspace = true
gs-web.workspace = true
gs-shell-rpc.workspace = true
futures-util.workspace = true
tokio.workspace = true
parking_lot.workspace = true

[features]
# Lessons on gs-runtime's FakeAgent (`app::agents::use_runtime`), for this crate's and the server's tests.
stand-in = ["gs-runtime/fake"]

[target.'cfg(windows)'.dependencies]
file-id.workspace = true

[dev-dependencies]
gs-base = { workspace = true, features = ["lock-order-check"] }
gs-pdf = { workspace = true, features = ["test-support"] }
gs-runtime = { workspace = true, features = ["fake"] }
gs-services = { workspace = true, features = ["stand-in"] }

[lints]
workspace = true
