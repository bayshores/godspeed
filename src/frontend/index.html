<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="A teacher agent with a memory: lessons, quizzes, and a knowledge graph of what you know." />
		<link rel="icon" href="/icon.png" type="image/png" />
		<link rel="preload" href="./fonts/literata-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="./fonts/dotgothic16-latin.woff2" as="font" type="font/woff2" crossorigin />
		<!-- No <title>: each page renders its own (routes/page-title.tsx). -->
		<!-- Asks for /api/boot while the app's code still loads (main.tsx reads the answer). -->
		<script>
			window.bootRequest = fetch("/api/boot", { cache: "no-store" })
				.then((res) => (res.ok ? res.json() : null))
				.catch(() => null);
		</script>
	</head>
	<body class="min-h-dvh antialiased">
		<!-- display: contents keeps the app's elements laid out as the body's own children. -->
		<div id="root" style="display: contents"></div>
		<script type="module" src="./main.tsx"></script>
	</body>
</html>
