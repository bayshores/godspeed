name: CI

# Docs (incl. docs/design) and README-only changes skip the build (nothing to test).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Typecheck, tests, lint, dead code, Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # cargo builds the Tauri shell too, which links against WebKitGTK.
      - name: Linux packages for the shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-machete --locked --version 0.9.2
      - run: npm ci
      # The search tests run the model, and on Linux load ONNX Runtime from .stage/.
      - run: node scripts/fetch-model.mjs
      - run: node scripts/fetch-onnxruntime.mjs
      # Typecheck, tests, lint, knip, then cargo test, clippy and cargo machete.
      - run: npm run check
      - name: Skill tests (Python)
        run: python3 -B -m unittest discover -s tests/skills

  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon.
          - os: macos-15
            platform: mac
          - os: windows-2025
            platform: windows
          # The oldest Ubuntu the Linux app supports, as the release builds it.
          - os: ubuntu-24.04
            platform: linux
            container: ubuntu:22.04
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Linux packages (Ubuntu 22.04 container)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3 xvfb xauth \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - run: npm ci
      - run: node scripts/fetch-model.mjs
      - run: node scripts/fetch-pdfium.mjs
      - if: runner.os == 'Linux'
        run: node scripts/fetch-onnxruntime.mjs
      # The UI, the release server and the pdf.js files, as `tauri build` stages them.
      - run: node scripts/stage-app.mjs
      - run: node scripts/smoke-server.mjs
      - name: Shell tests
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a cargo test -p gs-shell; else cargo test -p gs-shell; fi
      - name: Demo runner self-test in the real app
        run: |
          cargo build -p gs-shell --features self-test
          case "$RUNNER_OS" in
            Windows) target/debug/godspeed.exe --self-test ;;
            Linux) xvfb-run -a target/debug/godspeed --self-test ;;
            *) target/debug/godspeed --self-test ;;
          esac
