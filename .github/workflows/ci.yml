name: CI

# Every branch is checked: main takes a commit only after its quality job passed (docs/checks.md).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Typecheck, tests, lint, dead code, Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The whole history: the ratchet check compares the branch with origin/main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The runner's Ubuntu mirror sometimes takes over 10 minutes to send these packages, so the
      # downloaded files are kept in the cache, one copy per runner image.
      - name: Runner image
        id: image
        run: echo "key=apt-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore the downloaded Linux packages
        id: apt
        uses: actions/cache/restore@v6
        with:
          path: ~/apt
          key: ${{ steps.image.outputs.key }}
          restore-keys: apt-
      # cargo builds the Tauri shell too, which links against WebKitGTK.
      - name: Linux packages for the shell
        run: |
          mkdir -p ~/apt/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt" -o APT::Sandbox::User=root \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          sudo chown -R "$USER" ~/apt
      - name: Save the downloaded Linux packages
        if: steps.apt.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/apt
          key: ${{ steps.image.outputs.key }}
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        run: rustup toolchain install
      # Other branches and pull requests restore main's caches but save none, so they never push
      # main's out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-machete --locked --version 0.9.2
      - run: npm ci
      # The search tests run the model, and on Linux load ONNX Runtime from .stage/.
      - run: node scripts/fetch-model.mjs
      - run: node scripts/fetch-onnxruntime.mjs
      # Typecheck, tests, lint, knip, then cargo test, clippy and cargo machete.
      - run: npm run check
      - name: Skill tests (Python)
        run: python3 -B -m unittest discover -s tests/skills

  # The slow jobs below run on main and on pull requests, and not for a change to the docs alone.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A failed compare (a new branch, a force push, a run started by hand) counts as a change,
          # and so does a full first page of 300 files.
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$GITHUB_SHA" --jq '.files[].filename') || files=unknown
          if [[ $(wc -l <<<"$files") -ge 300 ]] || grep -qvE '^(docs/|README\.md$)' <<<"$files"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.app == 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon.
          - os: macos-15
            platform: mac
          - os: windows-2025
            platform: windows
          # The oldest Ubuntu the Linux app supports, as the release builds it.
          - os: ubuntu-24.04
            platform: linux
            container: ubuntu:22.04
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The package servers can be so slow that this one-minute step takes an hour, so the downloaded
      # packages are kept for a week. gzip on both sides: the image has no zstd before the install.
      - name: This week's key for the downloaded Linux packages
        if: runner.os == 'Linux'
        id: debs
        run: echo "key=debs-jammy-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the downloaded Linux packages
        if: runner.os == 'Linux'
        id: debs-restore
        uses: actions/cache/restore@v6
        with:
          path: /var/cache/debs
          key: ${{ steps.debs.outputs.key }}
          restore-keys: debs-jammy-
      - name: Linux packages (Ubuntu 22.04 container)
        if: runner.os == 'Linux'
        run: |
          # The image's own servers (archive.ubuntu.com) once stopped answering; this mirror still did.
          sed -i -E 's#http://(archive|security)\.ubuntu\.com#http://azure.archive.ubuntu.com#' /etc/apt/sources.list
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nDir::Cache::Archives "/var/cache/debs";\n' > /etc/apt/apt.conf.d/80-godspeed
          mkdir -p /var/cache/debs/partial
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3 unzip xvfb xauth \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          # Packages the servers no longer offer leave the kept set.
          apt-get autoclean
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Save the downloaded Linux packages
        if: runner.os == 'Linux' && steps.debs-restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: /var/cache/debs
          key: ${{ steps.debs.outputs.key }}
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: node scripts/fetch-model.mjs
      - run: node scripts/fetch-pdfium.mjs
      - if: runner.os == 'Linux'
        run: node scripts/fetch-onnxruntime.mjs
      # The UI, the release server and the pdf.js files, as a release stages them.
      - run: node scripts/stage-app.mjs
      - name: Smoke-test the release server
        timeout-minutes: 5
        run: node scripts/smoke-server.mjs
      # On the Mac the window job runs these, beside this one.
      # A hung test fails in minutes, not at the job's hour.
      - name: Shell tests
        if: runner.os != 'macOS'
        timeout-minutes: 15
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a cargo test -p gs-shell; else cargo test -p gs-shell; fi
      - name: Demo runner self-test in the real app
        if: runner.os != 'macOS'
        run: |
          cargo build -p gs-shell --features self-test
          case "$RUNNER_OS" in
            Windows) target/debug/godspeed.exe --self-test ;;
            Linux) xvfb-run -a target/debug/godspeed --self-test ;;
            *) target/debug/godspeed --self-test ;;
          esac

  # The Mac's debug builds in the real app window, beside the release server build in the desktop
  # job instead of after it. The layout walk is the longest step and a runner is too small to walk
  # its parts side by side, so each part has a runner of its own; the last, the shortest, also
  # runs the shell's tests.
  window:
    name: App window (mac, part ${{ matrix.part }} of 4)
    needs: changes
    if: needs.changes.outputs.app == 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # The parts share one cache; the part that builds the most saves it.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.part == 4 }}
      - run: npm ci
      - run: node scripts/fetch-model.mjs
      - run: node scripts/fetch-pdfium.mjs
      - name: Shell tests
        if: matrix.part == 4
        timeout-minutes: 15
        run: cargo test -p gs-shell
      - name: Demo runner self-test in the real app
        if: matrix.part == 4
        run: |
          cargo build -p gs-shell --features self-test
          target/debug/godspeed --self-test
      # The screens in the real WebKit window on made-up data, checked for broken layout.
      - name: Layout check in the real app window
        env:
          LAYOUT_SHARE: ${{ matrix.part }}/4
        run: npm run layout
      - name: Keep the layout report and pictures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: layout-part-${{ matrix.part }}
          path: target/layout

  # Tag runs restore the release build caches that a rehearsal on main saved
  # (docs/desktop-release.md). This starts one when they are stale or missing.
  release-cache:
    name: Warm the release caches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start a release rehearsal on main when its caches are stale or missing
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          why=""
          # A failed compare (a force push) counts as a change.
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename') || files=Cargo.lock
          if grep -qxE 'Cargo\.(lock|toml)|rust-toolchain\.toml|crates/[^/]+/Cargo\.toml|\.github/workflows/release\.yml' <<<"$files"; then
            why="the Rust dependencies, the toolchain or release.yml changed"
          fi
          # Also after GitHub deleted one (unused for 7 days, or pushed out of the 10 GB).
          for platform in mac-intel windows; do
            if [[ -z "$(gh cache list -R "$GITHUB_REPOSITORY" --ref refs/heads/main --key "v1-rust-release-$platform-package-" --json id --jq '.[].id')" ]]; then
              why="main has no $platform release cache"
            fi
          done
          if [[ -z "$why" ]]; then
            echo "The release caches are current."
          elif [[ "$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --branch main --json status --jq 'map(select(.status != "completed")) | length')" != 0 ]]; then
            echo "A rehearsal on main is already running ($why)."
          else
            echo "Starting a rehearsal on main: $why."
            gh workflow run release.yml --ref main -R "$GITHUB_REPOSITORY"
          fi
