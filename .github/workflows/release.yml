name: Desktop release

on:
  push:
    tags: ["v*"]
  # Manual runs are rehearsals: no Apple signing, a throwaway updater key, artifacts only.
  # They NEVER create, change or upload to a release.
  workflow_dispatch:
    inputs:
      staging_percentage:
        description: Share (0 to 100) of Electron Macs the hand-over feed offers this version to
        default: "10"

permissions:
  contents: read

# Serialize separate runs for the same ref; never cancel an upload in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAURI_APP_PATH: crates/shell
  # The share of Electron Macs that latest-mac.yml offers this version to. 10 is for the first
  # Tauri release; set it to 100 (no staging) once that move is done (docs/desktop-release.md).
  MAC_STAGING_PERCENTAGE: ${{ inputs.staging_percentage || '10' }}

jobs:
  quality:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must equal v$version"
            exit 1
          fi
      - name: Linux packages for the shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-machete --locked --version 0.9.2
      - run: npm ci
      # The search tests run the model, and on Linux load ONNX Runtime from .stage/.
      - run: node scripts/fetch-model.mjs
      - run: node scripts/fetch-onnxruntime.mjs
      - run: npm run check
      - name: Skill tests (Python)
        run: python3 -B -m unittest discover -s tests/skills

  # Speed: the draft and the three package jobs start right away, in parallel with the gates.
  # A failed gate still blocks the release: verify needs quality, and only the owner publishes.
  draft:
    name: Prepare one draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Only the changelog: the release page shows the same notes as the app's "What's new".
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          sparse-checkout: src/shared/changelog.json
          sparse-checkout-cone-mode: false
      # This job succeeds without creating anything on manual rehearsals.
      # Preparing once means the OS jobs never race to create the draft.
      - name: Create or reuse the tag's draft
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, "");
            const version = tag.slice(1);
            // A release needs notes: stop here when src/shared/changelog.json has none.
            const changelog = JSON.parse(require("fs").readFileSync("src/shared/changelog.json", "utf8"));
            const entry = changelog.find(e => e.version === version);
            if (!entry || !Array.isArray(entry.changes) || entry.changes.length === 0) {
              throw new Error(`src/shared/changelog.json has no notes for ${version}; add them before releasing.`);
            }
            // Download links first, for people new to GitHub. These names are the ones
            // scripts/release-assets.mjs gives the bundler's files.
            const link = name => `[${name}](https://github.com/${owner}/${repo}/releases/download/${tag}/${name})`;
            const body = [
              "## Download",
              "",
              "| Your computer | Download |",
              "|---|---|",
              `| Mac with an Apple chip (M1 or newer) | ${link("godspeed-mac-apple-silicon.dmg")} |`,
              `| Windows | ${link("godspeed-windows-x64-setup.exe")} |`,
              `| Linux | ${link("godspeed-linux-x64.AppImage")} (or ${link("godspeed-linux-x64.deb")} for Ubuntu and Debian) |`,
              "",
              "You only need one file. The other files below are for automatic updates. Ignore them.",
              "",
              "## What's new",
              "",
              ...entry.changes.map(c => `- ${c}`),
              "",
            ].join("\n");
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const matches = releases.filter(release =>
              release.tag_name === tag || release.tag_name === version);
            if (matches.length > 1) {
              throw new Error(`Multiple releases match ${tag}; resolve them before uploading.`);
            }
            if (matches.length === 1) {
              if (!matches[0].draft) {
                throw new Error(`${tag} is already published; refusing to modify it.`);
              }
              await github.rest.repos.updateRelease({owner, repo, release_id: matches[0].id, body});
              core.info(`Reusing draft ${matches[0].id} for ${tag}`);
              return;
            }
            const {data} = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: version, draft: true, body,
            });
            core.info(`Created draft ${data.id} for ${tag}`);

  package:
    name: Package (${{ matrix.platform }})
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 26's actool compiles the .icon app icon and needs macOS 26.
          - os: macos-26
            platform: mac
            triple: aarch64-apple-darwin
            bundles: app,dmg
            config: ""
          - os: windows-2025
            platform: windows
            triple: x86_64-pc-windows-msvc
            bundles: nsis
            config: --config crates/shell/tauri.bundle.windows.conf.json
          # Built on the oldest Ubuntu the Linux app supports (glibc 2.35).
          - os: ubuntu-24.04
            platform: linux
            container: ubuntu:22.04
            triple: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            config: --config crates/shell/tauri.bundle.linux.conf.json
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # Apple's notarization queue has taken about 2 hours for this team.
    timeout-minutes: 180
    env:
      # No FUSE in containers; the AppImage tools unpack themselves instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Linux packages (Ubuntu 22.04 container)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3 xvfb xauth binutils \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The upload step needs gh, which the container does not have (GitHub's own apt repository).
      - name: GitHub CLI (Ubuntu 22.04 container)
        if: runner.os == 'Linux' && github.event_name == 'push'
        run: |
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y gh
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Select Xcode 26+ for actool (the Mac icon)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: TEMP icon compiler probe
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          try() {
            label=$1; dir=$2; shift 2
            rm -rf "$dir"; mkdir -p "$dir/out"; cp -R crates/shell/icons/icon.icon "$dir/Icon.icon"
            if env "$@" actool "$dir/Icon.icon" --compile "$dir/out" --output-format human-readable-text --notices --warnings --output-partial-info-plist "$dir/out/assetcatalog_generated_info.plist" --app-icon Icon --include-all-app-icons --accent-color AccentColor --enable-on-demand-resources NO --development-region en --target-device mac --minimum-deployment-target 26.0 --platform macosx > "$dir/log.txt" 2>&1; then echo "PROBE $label: ok"; else echo "PROBE $label: FAILED"; head -3 "$dir/log.txt"; fi
          }
          actool --version | grep -A1 short-bundle
          sw_vers
          try plain "$RUNNER_TEMP/probe1" A=1
          try plain-again "$RUNNER_TEMP/probe2" A=1
          try hidden-dir "$TMPDIR/.tmpProbe1" A=1
          try tmpdir-visible "$TMPDIR/probe3" A=1
          try deployment-env "$RUNNER_TEMP/probe4" MACOSX_DEPLOYMENT_TARGET=14.0
          try hidden-and-env "$TMPDIR/.tmpProbe2" MACOSX_DEPLOYMENT_TARGET=14.0
          ls -la crates/shell/icons/icon.icon crates/shell/icons/icon.icon/Assets
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
      - run: npm ci
      - run: node scripts/fetch-model.mjs
      - run: node scripts/fetch-pdfium.mjs
      - if: runner.os == 'Linux'
        run: node scripts/fetch-onnxruntime.mjs
      # Stage once here so the smoke runs before the slow bundler (tauri build stages again, cached).
      - run: node scripts/stage-app.mjs
      - run: node scripts/smoke-server.mjs

      - name: Check the signing secrets
        if: github.event_name == 'push'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os != 'macOS' && 'not needed' || secrets.MAC_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os != 'macOS' && 'not needed' || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os != 'macOS' && 'not needed' || secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ runner.os != 'macOS' && 'not needed' || secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ runner.os != 'macOS' && 'not needed' || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ runner.os != 'macOS' && 'not needed' || secrets.APPLE_TEAM_ID }}
        # The bundler only warns and skips notarization when the Apple ID secrets are missing.
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret for $name"
              exit 1
            fi
          done

      - name: Build, sign and notarize (macOS release)
        if: github.event_name == 'push' && runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --config crates/shell/tauri.bundle.conf.json ${{ matrix.config }} --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}
      - name: Build (Windows and Linux release)
        if: github.event_name == 'push' && runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config crates/shell/tauri.bundle.conf.json ${{ matrix.config }} --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}
      # A throwaway key still writes the .sig files, so the feeds job rehearses too. Without an
      # Apple identity the bundler signs nothing on the Mac.
      - name: Build (rehearsal, no Apple signing, throwaway updater key)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx tauri signer generate --ci -p "" -w "$RUNNER_TEMP/rehearsal.key"
          TAURI_SIGNING_PRIVATE_KEY="$RUNNER_TEMP/rehearsal.key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
            npx tauri build --config crates/shell/tauri.bundle.conf.json ${{ matrix.config }} --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}

      - run: node scripts/release-assets.mjs ${{ matrix.platform }}

      # Squirrel.Mac checks the new app against the running Electron app's designated requirement,
      # so the Tauri app must satisfy that exact text, in the bundle and in the zip Electron gets.
      - name: Check the Mac signature, notarization and hand-over requirement
        if: github.event_name == 'push' && runner.os == 'macOS'
        run: |
          set -euo pipefail
          requirement="=$(cat crates/shell/release/electron-requirement.txt)"
          version=$(node -p 'require("./package.json").version')
          unzipped=$(mktemp -d)
          ditto -x -k "dist/godspeed-$version-arm64-mac.zip" "$unzipped"
          for app in "target/${{ matrix.triple }}/release/bundle/macos/godspeed.app" "$unzipped/godspeed.app"; do
            echo "checking $app"
            codesign --verify --deep --strict --all-architectures -R "$requirement" "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      # Linux builds must run on Ubuntu 22.04 and Debian 12 (glibc 2.35 and 2.36, and the
      # libstdc++ of 22.04, GLIBCXX 3.4.30). The two libraries ship as downloaded.
      - name: Check the glibc and libstdc++ the Linux binaries need
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for bin in "target/${{ matrix.triple }}/release/godspeed" "target/${{ matrix.triple }}/release/godspeed-server" .stage/libpdfium.so .stage/libonnxruntime.so; do
            for need in GLIBC:2.35 GLIBCXX:3.4.30; do
              name=${need%%:*} limit=${need#*:}
              newest=$(objdump -T "$bin" | { grep -o "${name}_[0-9.]*" || true; } | sed "s/${name}_//" | sort -V | tail -n 1)
              echo "$bin needs $name ${newest:-none}"
              if [[ -n "$newest" && "$(printf '%s\n%s\n' "$newest" "$limit" | sort -V | tail -n 1)" != "$limit" ]]; then
                echo "::error::$bin needs $name $newest, above $limit"
                exit 1
              fi
            done
          done

      - name: Demo runner self-test in the real app
        run: |
          cargo build -p gs-shell --features self-test
          case "$RUNNER_OS" in
            Windows) target/debug/godspeed.exe --self-test ;;
            Linux) xvfb-run -a target/debug/godspeed --self-test ;;
            *) target/debug/godspeed --self-test ;;
          esac

      - name: Save the downloads and signatures
        uses: actions/upload-artifact@v7
        with:
          name: godspeed-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: dist/

      - name: Upload the downloads to the draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The .sig files are not assets; their text goes into latest.json.
        run: |
          shopt -s extglob
          gh release upload "$GITHUB_REF_NAME" dist/!(*.sig) --clobber -R "$GITHUB_REPOSITORY"

  feeds:
    name: Write the update feeds
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Gather the three systems' downloads
        uses: actions/download-artifact@v8
        with:
          pattern: godspeed-*
          path: dist
          merge-multiple: true
      - run: node scripts/release-feeds.mjs dist --mac-staging "$MAC_STAGING_PERCENTAGE"
      - name: Save the feeds
        uses: actions/upload-artifact@v7
        with:
          name: godspeed-feeds
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/latest.json
            dist/latest*.yml
      - name: Upload the feeds to the draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/latest.json dist/latest-mac.yml dist/latest.yml dist/latest-linux.yml --clobber -R "$GITHUB_REPOSITORY"

  # The last gate before a human publishes: fail the run unless the tag's single draft holds
  # exactly the ten assets and the four feeds point at them at the package.json version.
  # Read-only: it never creates, edits, publishes or deletes anything. Rehearsals upload nothing,
  # so there is no draft to verify and the job stays skipped.
  verify:
    name: Verify draft release
    needs: [quality, feeds]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub hides drafts from tokens without push access. The commands below stay GET-only;
    # only the two API-reading steps see this token.
    permissions:
      contents: write
    steps:
      # The tagged revision: verify exactly what was packaged.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: List every release, drafts included
        env:
          GH_TOKEN: ${{ github.token }}
        # --slurp wraps the pages into one JSON document; the validator flattens it.
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Select the tag's single draft
        # Machine JSON on stdout (release id + asset ids); warnings on stderr.
        run: npx tsx scripts/verify-release.ts select "$RUNNER_TEMP/releases.json" --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/draft.json"
      - name: Download the four update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feeds"
          for name in latest.json latest-mac.yml latest.yml latest-linux.yml; do
            id=$(DRAFT="$RUNNER_TEMP/draft.json" NAME="$name" node -e '
              const fs = require("node:fs");
              const draft = JSON.parse(fs.readFileSync(process.env.DRAFT, "utf8"));
              const asset = draft.assets.find((entry) => entry.name === process.env.NAME);
              if (asset == null) { console.error("draft has no " + process.env.NAME); process.exit(1); }
              console.log(asset.id);
            ')
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H "Accept: application/octet-stream" > "$RUNNER_TEMP/feeds/$name"
            echo "downloaded $name ($(wc -c < "$RUNNER_TEMP/feeds/$name") bytes)"
          done
      - name: Verify draft assets and update feeds
        run: npx tsx scripts/verify-release.ts verify "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/feeds" --tag "$GITHUB_REF_NAME"
