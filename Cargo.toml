[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
gs-json = { path = "crates/json" }
gs-base = { path = "crates/base" }
gs-core = { path = "crates/core" }
gs-store = { path = "crates/store" }
gs-files = { path = "crates/files" }
gs-pdf = { path = "crates/pdf" }
gs-search = { path = "crates/search" }
gs-media = { path = "crates/media" }
gs-web = { path = "crates/web" }
gs-transcribe = { path = "crates/transcribe" }
gs-engine = { path = "crates/engine" }
gs-agent = { path = "crates/agent" }
gs-services = { path = "crates/services" }
gs-shell-rpc = { path = "crates/shell-rpc" }

axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "multipart"] }
block2 = "=0.6.2"
bytes = "1.12"
cairo-rs = "=0.18.5"
dom_smoothie = "0.19"
file-id = { version = "0.2.3", default-features = false }
fontdb = "0.23"
futures-util = "0.3.34"
getrandom = "0.3.4"
gtk = "=0.18.2"
htmd = "0.5.6"
http-body-util = "0.1.5"
icu_collator = "2.4"
icu_locale_core = "2.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
indexmap = "2.14"
jiff = "0.2.42"
markdown = "=1.0.0"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-pdf-kit = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std"] }
# gs-search adds the features each platform needs.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing"] }
os_info = { version = "3.15.0", default-features = false }
parking_lot = "0.12.5"
pdfium-render = { version = "0.9.5", default-features = false, features = ["image_latest", "thread_safe", "pdfium_latest"] }
regress = { version = "0.12", features = ["utf16"] }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
resvg = "0.47"
ryu-js = "1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10.9"
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
tower = { version = "0.5.3", default-features = false }
url = "2.5.8"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-util", "io-std", "net", "process", "fs"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
webview2-com = "=0.39.1"
windows = "=0.62.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
# stdout is the line protocol to the desktop shell (gs-shell-rpc).
print_stdout = "deny"

# A panic in one request must answer an empty 500 and keep the server up (the HTTP layer catches it).
[profile.dev]
panic = "unwind"

# A class's search index is megabytes of JSON and vectors, rewritten on every file change.
# Unoptimized, that write takes a quarter second, so these crates are optimized in dev builds too.
[profile.dev.package.gs-json]
opt-level = 3

[profile.dev.package.gs-base]
opt-level = 3

[profile.dev.package.gs-search]
opt-level = 3

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 4
